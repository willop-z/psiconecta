<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Psiconecta — Panel de administrador</title>
        <link rel="stylesheet" href="css/admin.css" />
    </head>
    <body>
        <header class="header-simple">
            <a href="index.html" class="logo">
                <img src="/images/logo-titulo-slogan.jpg" alt="Logo" class="logo-imagen" />
            </a>
            <a href="index.html" class="btn-cerrar-sesion">Cerrar sesión</a>
        </header>

        <section class="admin">
            <h1>Documentos pendientes de verificación</h1>
            <p class="admin-subtitulo">
                Revisa y aprueba o rechaza los documentos cargados por psicólogos y practicantes.
            </p>

            <table class="admin-tabla">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Documento</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </section>

        <footer class="footer">
            <div class="footer-contenido">
                <span class="logo-texto">Psiconecta</span>
                <p>Plataforma de orientación psicológica voluntaria</p>
            </div>

            <div class="footer-contacto">
                <p>
                    ¿Dudas o soporte?
                    <a href="mailto:soportepsiconecta@gmail.com">soportepsiconecta@gmail.com</a>
                </p>
            </div>
        </footer>


        <script src="js/sesion.js"></script>
        <script src="js/admin.js"></script>

    </body>
</html>
