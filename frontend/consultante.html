<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psiconecta — Registro de consultante</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header-simple">
    <a href="index.html" class="logo">
        <span class="logo-texto">Psiconecta</span>
    </a>
</header>

<section class="registro">
    <div class="registro-formulario">
        <h1>Crea tu cuenta como consultante</h1>
        <p class="registro-subtitulo">Regístrate para explorar psicólogos y practicantes disponibles.</p>

        <form>
            <div class="registro-campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="registro-campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="registro-campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>

            <div class="registro-campo">
                <label for="confirmar-contrasena">Confirmar contraseña</label>
                <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required>
            </div>

            <div class="registro-campo registro-campo-checkbox">
                <input type="checkbox" id="mayor-edad" name="mayor-edad" required>
                <label for="mayor-edad">Declaro que soy mayor de edad</label>
            </div>

            <button type="submit" class="btn-registrar">Crear cuenta</button>
        </form>
    </div>
</section>

</body>
<script src="js/script.js"></script>
</html>
