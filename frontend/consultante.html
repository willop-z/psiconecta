<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psiconecta — Consultante</title>
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

<header class="header-simple">
    <a href="index.html" class="logo">
        <span class="logo-texto">Psiconecta</span>
    </a>
</header>

<section class="registro">
    <div class="registro-formulario">
        <h1>Crea tu cuenta como consultante</h1>
        <p class="registro-subtitulo">Regístrate para explorar psicólogos y practicantes disponibles.</p>

        <form>
            <div class="registro-campo">
                <label for="nombre">Nombre completo</label> <!-- for debe coincidir con el id del input -->
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required> 
                <!-- type es el dato esperado, name es el nombre del campo que va al backend, 
                required asegura que el campo sea obligatorio -->
            </div>

            <div class="registro-campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
            </div>

            <div class="registro-campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña" required>
            </div>

            <div class="registro-campo">
                <label for="confirmar-contrasena">Confirmar contraseña</label>
                <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" placeholder="Confirma tu contraseña" required>
            </div>

            <div class="registro-campo">
                <label for="fecha-nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
            </div>

            <button type="submit" class="btn-registrar">Crear cuenta</button>
        </form>
    </div>
</section>

</body>
<script src="js/script.js"></script>
</html>
